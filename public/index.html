<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12101a" media="(prefers-color-scheme: dark)">
<title>MessageAnywhere</title>
<style>
/* ===== Tokens — the only place colour values are written. Named by role. ===== */
:root{
  color-scheme:light dark;
  --bg-base:#f2f2f7;
  --bg-platform:#f2f2f7;
  --bg-surface:#fff;
  --bg-surface-raised:#fff;
  --bg-surface-alpha:rgba(255,255,255,.72);
  --bg-sidebar:rgba(255,255,255,.72);
  --bg-overlay:rgba(0,0,0,.25);
  --bg-input:rgba(120,120,128,.12);
  --bg-lightbox:rgba(0,0,0,.92);
  --border-subtle:rgba(60,60,67,.12);
  --border-default:rgba(60,60,67,.22);
  --text-primary:#000;
  --text-secondary:rgba(60,60,67,.64);
  --text-tertiary:rgba(60,60,67,.4);
  --accent:#007aff;
  --accent-hover:#0a6fe0;
  --accent-soft:rgba(0,122,255,.10);
  --accent-soft-strong:rgba(0,122,255,.16);
  --accent-on:#fff;
  --status-success:#248a3d;
  --status-success-soft:rgba(52,199,89,.16);
  --status-online:#34c759;
  --status-danger:#ff3b30;
  --status-danger-soft:rgba(255,59,48,.12);
  --danger-on:#fff;
  --device-1:#30b0c7;--device-2:#ff9500;--device-3:#af52de;--device-4:#5856d6;--device-5:#ff2d55;
  --dv-mix:100%;--dv-fg:#fff;
  --on-photo:#fff;
  --glass-filter:blur(14px) saturate(180%);
  --glass-edge:rgba(255,255,255,.75);
  --glass-rim-lit:rgba(255,255,255,.95);
  --glass-rim-shade:rgba(0,0,0,.06);
  --glass-sheen:rgba(255,255,255,.55);
  --edge-tint:rgba(242,242,247,.6);
  --shadow-float:0 8px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06);
  --shadow-lift:0 20px 60px rgba(0,0,0,.25);
  --bg-ambient:none;
}
/* Nebula Purple — values match the reference app exactly. */
@media (prefers-color-scheme:dark){:root{
  --bg-base:#12101a;
  --bg-platform:#171523;
  --bg-surface:#1c1a2a;
  --bg-surface-raised:#1c1a28;
  --bg-surface-alpha:rgba(30,27,44,.85);
  --bg-sidebar:rgba(18,16,26,.92);
  --bg-overlay:rgba(22,20,30,.86);
  --bg-input:rgba(255,255,255,.08);
  --bg-bubble:rgba(40,36,56,.90);
  --bg-code-block:rgba(0,0,0,.32);
  --bg-code-inline:rgba(255,255,255,.085);
  --bg-lightbox:rgba(12,10,20,.95);
  --border-subtle:rgba(196,181,253,.10);
  --border-default:rgba(196,181,253,.18);
  --text-primary:#f3f0fb;
  --text-secondary:#b6a8d9;
  --text-tertiary:#8a7cb0;
  --accent:#8b7cf6;
  --accent-hover:#9d90f8;
  --accent-soft:rgba(139,124,246,.14);
  --accent-soft-strong:rgba(139,124,246,.22);
  --accent-on:#0d0a1c;
  /* derived — not in the supplied palette */
  --status-success:#7ee0b0;
  --status-success-soft:rgba(126,224,176,.14);
  --status-online:#7ee0b0;
  --status-danger:#f48aa6;
  --status-danger-soft:rgba(244,138,166,.14);
  --danger-on:#0d0a1c;
  --device-1:#8fd3f4;--device-2:#f5b98a;--device-3:#d8a6f5;--device-4:#a5a8f8;--device-5:#f0d98a;
  --dv-mix:16%;--dv-fg:initial;
  --on-photo:#f3f0fb;
  --glass-filter:blur(12px) saturate(140%);
  --glass-edge:var(--border-default);
  --glass-rim-lit:rgba(243,240,251,.30);
  --glass-rim-shade:rgba(196,181,253,.08);
  --glass-sheen:rgba(243,240,251,.09);
  --edge-tint:rgba(18,16,26,.55);
  --shadow-float:0 12px 36px rgba(6,4,14,.55);
  --shadow-lift:0 24px 60px rgba(6,4,14,.6);
  --bg-ambient:
    radial-gradient(1100px 620px at 82% -8%,rgba(139,124,246,.32),transparent 60%),
    radial-gradient(820px 520px at 12% 110%,rgba(126,96,220,.16),transparent 55%),
    radial-gradient(1300px 820px at 48% 44%,rgba(28,24,44,.5),transparent 72%),
    linear-gradient(165deg,#18141f 0%,#120f1c 55%,#14111e 100%);
}}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background-color:var(--bg-base);color:var(--text-primary);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
input,textarea{outline:none;border:0;background:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.glass{background:linear-gradient(160deg,var(--glass-sheen),transparent 55%),var(--bg-surface-alpha);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);border:1px solid var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim-lit),inset -1px -1px 0 var(--glass-rim-shade),var(--shadow-float)}

/* ===== Shell ===== */
.app{height:var(--vvh,100dvh);display:grid;grid-template-columns:minmax(0,1fr);background-color:var(--bg-base);background-image:var(--bg-ambient);overflow:hidden}
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px;scrollbar-width:thin;scrollbar-color:var(--border-default) transparent}
.content{padding-bottom:12px}

/* sidebar (iPad / desktop) */
.side{display:none;flex-direction:column;margin:12px 0 12px 12px;border-radius:26px;padding:14px 10px 12px;overflow:auto;z-index:2}
.side.glass{background:linear-gradient(160deg,var(--glass-sheen),transparent 40%),var(--bg-sidebar)}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--status-online);flex-shrink:0}
.dot.off{background:var(--status-danger)}
.side h3{font-size:13px;font-weight:600;color:var(--text-secondary);padding:14px 10px 6px;display:flex;justify-content:space-between}
.si{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 10px;border-radius:12px;font-size:15px;width:100%;text-align:left}
.si:hover{background:var(--accent-soft)}
.si[aria-current="true"]{background:var(--accent-soft-strong);box-shadow:inset 0 0 0 1px var(--border-default)}
.si>.ic{color:var(--accent);width:19px;height:19px}
.si .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .cnt{font-size:14px;color:var(--text-secondary)}
.si .dv{width:26px;height:26px;border-radius:7px}
.si .dv .ic{width:15px;height:15px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--accent-soft);text-align:left;width:100%}
.me .dv{width:34px;height:34px;border-radius:9px}
.me b{display:block;font-size:15px;font-weight:600}
.me small{font-size:12.5px;color:var(--text-secondary)}
.me .ic.ed{margin-left:auto;color:var(--accent);width:18px}

/* device tile — solid in light, quiet tint in dark */
.dv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--dc) var(--dv-mix),transparent);color:var(--dv-fg,var(--dc));box-shadow:inset 0 0 0 1px var(--border-subtle)}
.dv .ic{width:15px;height:15px;stroke-width:2}

/* scroll-edge glass + collapsing title */
.edge{position:absolute;left:0;right:0;top:0;height:112px;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(var(--edge-tint),transparent);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.main.scrolled .edge{opacity:1}
.nav{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:56px;padding-top:8px;position:sticky;top:0;z-index:5}
.nav .left{margin-right:auto}
.mini{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);margin-top:4px;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.main.scrolled .mini{opacity:1;transform:translate(-50%,-50%)}
.gbtn{height:44px;min-width:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px;font-size:16px;font-weight:500}
.gbtn .ic{width:21px;height:21px}
.gbtn.back{color:var(--accent);padding:0 14px 0 8px}
.ggroup{display:flex;height:44px;border-radius:22px;overflow:hidden}
.ggroup button{width:44px;display:grid;place-items:center}
.ggroup button+button{border-left:1px solid var(--border-subtle)}
.ggroup button[aria-expanded="true"]{color:var(--accent)}
.big{padding:2px 4px 14px}
.big h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere;transition:opacity .15s}
.main.scrolled .big h1{opacity:0}
.big p{font-size:15px;color:var(--text-secondary);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.big p .dot{width:7px;height:7px}
.search{display:flex;align-items:center;gap:7px;height:40px;padding:0 6px 0 10px;border-radius:14px;background:var(--bg-input);color:var(--text-secondary);margin:0 0 20px}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;font-size:17px;color:var(--text-primary)}
.search input::placeholder{color:var(--text-secondary)}
.search .clear{width:22px;height:22px;border-radius:50%;background:var(--text-tertiary);color:var(--bg-base);display:grid;place-items:center}
.search .clear .ic{width:12px;height:12px;stroke-width:3}

/* ===== Sections ===== */
.sec{margin-bottom:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.sh h2{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.sh h2 span{font-size:15px;font-weight:500;color:var(--text-secondary)}
.sh button{font-size:17px;color:var(--accent);display:flex;align-items:center;gap:2px}
.sh button .ic{width:14px;height:14px;stroke-width:2.4}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:56px 20px;color:var(--text-secondary);font-size:15px}
.empty b{font-size:20px;font-weight:600;color:var(--text-primary)}
.empty.err b{color:var(--status-danger)}

/* message: shared by Just In cards and list rows */
.msg{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.msg img,.msg a{-webkit-touch-callout:default}
.msg.editing{-webkit-user-select:text;user-select:text;cursor:default}
.meta{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--text-secondary);min-width:0}
.who{font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.who:hover{color:var(--accent)}
.meta time{white-space:nowrap;margin-left:auto}
.tx{font-size:17px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.tx.clamp{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.tx.muted{color:var(--text-secondary)}
.more{color:var(--accent);font-size:15px;margin-top:4px}
.reveal{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;min-height:56px;border-radius:14px;background:var(--bg-input);font-size:15px;color:var(--text-secondary)}
.reveal .ic{width:19px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:8px;border-radius:14px;overflow:hidden;max-width:420px}
.thumbs.one{grid-template-columns:1fr}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg-input);cursor:zoom-in}
.thumbs.one img{aspect-ratio:auto;max-height:360px}
.file{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px 8px 8px;border-radius:12px;background:var(--bg-input);color:inherit;text-decoration:none;max-width:420px}
.file:hover{background:var(--accent-soft)}
.doc{width:30px;height:37px;border-radius:6px;display:grid;place-items:end center;padding-bottom:4px;font-size:9px;font-weight:800;flex-shrink:0;clip-path:polygon(0 0,68% 0,100% 24%,100% 100%,0 100%);
  background:color-mix(in srgb,var(--fc) var(--dv-mix),transparent);color:var(--dv-fg,var(--fc))}
.file .fm{flex:1;min-width:0}
.file b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file small{font-size:13px;color:var(--text-secondary)}
.file>.ic{color:var(--accent);width:24px;height:24px;stroke-width:1.7}
.flash{position:absolute;right:12px;top:10px;display:none;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:600;background:var(--status-success-soft);color:var(--status-success);pointer-events:none}
.flash .ic{width:14px;height:14px;stroke-width:2.6}
.msg.copied .flash{display:flex;animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
.msg.copied .meta time{visibility:hidden}
.edit textarea{width:100%;min-height:84px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--bg-input);font-size:17px;line-height:1.35;resize:vertical;color:var(--text-primary);box-shadow:0 0 0 2px var(--accent)}
.edit .acts{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}
.edit .acts small{margin-right:auto;font-size:12.5px;color:var(--text-secondary)}
.pill{height:34px;padding:0 16px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;background:var(--bg-input);color:var(--accent)}
.pill.fill{background:var(--accent);color:var(--accent-on)}
.pill.fill:hover{background:var(--accent-hover)}

/* Just In carousel */
.just{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-padding:0 16px;align-items:start}
.card{scroll-snap-align:start;display:flex;flex-direction:column;padding:14px 16px 16px;border-radius:24px;background:var(--bg-surface);border:1px solid var(--border-subtle);min-height:132px}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .meta{flex:1}
.card .tx{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.card .tx.muted,.card .tx.body{font-weight:400;font-size:17px;letter-spacing:-.01em;line-height:1.35}

/* list rows */
.list{border-radius:24px;background:var(--bg-surface);border:1px solid var(--border-subtle);overflow:hidden}
.li{position:relative}
.li+.li::before{content:"";position:absolute;top:0;right:0;left:54px;height:1px;background:var(--border-subtle);z-index:1}
.li-in{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--bg-surface);transition:transform .2s ease;position:relative}
.li-in .dv{margin-top:1px}
.li-in .m{flex:1;min-width:0}
.li.swiped{background:var(--status-danger)}
.li.swiped::after{content:"Delete";position:absolute;right:0;top:0;bottom:0;width:90px;display:grid;place-items:center;color:var(--danger-on);font-size:15px;font-weight:600}
.li.msg:hover .li-in{background:var(--accent-soft)}
.list .li.msg:hover .li-in{background:color-mix(in srgb,var(--accent) 6%,var(--bg-surface))}
.frow{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;color:inherit;text-decoration:none;position:relative;background:var(--bg-surface)}
.frow+.frow::before{content:"";position:absolute;top:0;right:0;left:60px;height:1px;background:var(--border-subtle)}
.frow:hover{background:color-mix(in srgb,var(--accent) 6%,var(--bg-surface))}
.frow .doc{width:34px;height:42px;font-size:9.5px;padding-bottom:5px}
.frow .fm{flex:1;min-width:0}
.frow b{display:block;font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow small{font-size:14px;color:var(--text-secondary)}
.frow>.ic{color:var(--accent);width:26px;height:26px;stroke-width:1.7}

/* photo grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:24px;overflow:hidden}
.ph{position:relative;aspect-ratio:1;display:block;overflow:hidden;background:var(--bg-input)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.ph span{position:absolute;left:8px;bottom:6px;z-index:1;font-size:12px;font-weight:600;color:var(--on-photo);text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ===== Bottom: docked composer + tab bar ===== */
.bottom{flex-shrink:0;padding:8px 12px calc(6px + env(safe-area-inset-bottom));background:var(--bg-surface-alpha);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);border-top:1px solid var(--border-subtle)}
.composer{margin-bottom:6px}
.att{display:flex;align-items:center;gap:10px;padding:6px 4px 10px;overflow-x:auto;scrollbar-width:none}
.att .item{position:relative;width:48px;height:48px;border-radius:12px;flex-shrink:0;background:var(--bg-input);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--text-secondary);text-transform:uppercase}
.att img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.att .x{position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--text-tertiary);color:var(--bg-base);display:grid;place-items:center;border:2px solid var(--bg-base)}
.att .x .ic{width:10px;height:10px;stroke-width:3.2}
.att small{font-size:13px;color:var(--text-secondary);white-space:nowrap}
.crow{display:flex;align-items:flex-end;gap:4px}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--text-primary);flex-shrink:0}
.ib:hover{background:var(--accent-soft)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;min-height:40px;padding:0 4px 0 14px;border-radius:20px;background:var(--bg-input);border:1px solid var(--border-default);transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft-strong)}
.field textarea{flex:1;min-width:0;resize:none;font-size:17px;line-height:22px;padding:8px 0;max-height:140px;color:var(--text-primary);display:block}
.field textarea::placeholder{color:var(--text-secondary)}
.send{width:32px;height:32px;margin:3px 0;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-on);flex-shrink:0}
.send:hover{background:var(--accent-hover)}
.send:disabled{opacity:.45}
.send .ic{width:19px;height:19px;stroke-width:2.6}
.kbhint{display:none;visibility:hidden;gap:14px;flex-wrap:wrap;padding:8px 2px 0 88px;font-size:12.5px;color:var(--text-secondary)}
.kbhint kbd{font:500 11.5px inherit;font-family:inherit;padding:1px 6px;border-radius:5px;background:var(--bg-input);color:var(--text-primary)}
.tabbar{display:flex;align-items:center;margin:0 -12px;padding:0 12px;border-top:1px solid var(--border-subtle)}
.tabs{flex:1;display:flex;height:52px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text-secondary)}
.tab .ic{width:23px;height:23px}
.tab[aria-current="true"]{color:var(--accent)}
.sbtn{width:52px;height:52px;display:grid;place-items:center;color:var(--text-secondary)}
.sbtn .ic{width:24px;height:24px}

/* ===== Overlays ===== */
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
@keyframes up{from{transform:translateY(40px)}}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:18px;font-size:14px;font-weight:500;color:var(--status-danger);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.toast .ic{width:18px;height:18px}
.layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--bg-overlay);animation:fade .18s ease-out}
.scrim.blur{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.scrim.clear{background:transparent}
.menu{position:absolute;width:260px;border-radius:20px;overflow:hidden;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);transform-origin:top right}
.menu.glass{box-shadow:inset 1px 1px 0 var(--glass-rim-lit),inset -1px -1px 0 var(--glass-rim-shade),var(--shadow-lift)}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:8px 16px;font-size:17px;text-align:left}
.mi+.mi{border-top:1px solid var(--border-subtle)}
.mi:hover,.mi:focus-visible{background:var(--accent-soft);outline:0}
.mi .ic{width:19px;height:19px}
.mi.red{color:var(--status-danger)}
.mi .lab{display:flex;flex-direction:column;min-width:0}
.mi .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{font-size:13px;color:var(--text-secondary)}
.mi .dv{width:24px;height:24px;border-radius:7px}
.mi .dv .ic{width:14px;height:14px}
.mgap{height:8px;background:var(--border-subtle)}
.ctx{position:absolute;left:50%;top:16%;width:min(340px,calc(100% - 32px));transform:translateX(-50%)}
.ctx .preview{padding:14px 16px;border-radius:22px;background:var(--bg-surface-raised);border:1px solid var(--border-default);box-shadow:var(--shadow-lift);animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
.ctx .preview .tx{font-size:18px;font-weight:600;max-height:120px;overflow:hidden}
.ctx .menu{position:relative;margin-top:10px;width:250px;transform-origin:top left}
.ctx.at .menu{margin-top:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));border-radius:34px 34px 0 0;animation:up .32s cubic-bezier(.2,.9,.25,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--text-tertiary);margin:0 auto 10px}
.sbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:14px}
.sbar h3{font-size:17px;font-weight:600}
.sbar .gbtn{height:40px;min-width:40px;padding:0 16px}
.sbar .done{background:var(--accent);color:var(--accent-on);font-weight:600}
.namefield{display:flex;align-items:center;height:52px;padding:0 12px 0 16px;border-radius:16px;background:var(--bg-input);border:1px solid var(--border-default)}
.namefield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft-strong)}
.namefield input{flex:1;min-width:0;font-size:17px;color:var(--text-primary)}
.sheet .foot{font-size:13px;color:var(--text-secondary);padding:8px 16px 0}
.lb{position:fixed;inset:0;z-index:60;background:var(--bg-lightbox);display:flex;align-items:center;justify-content:center;animation:fade .18s ease-out}
.lb img{max-width:92vw;max-height:84vh;object-fit:contain;border-radius:6px;animation:pop .24s cubic-bezier(.2,.9,.3,1.1)}
.lb .gbtn{position:absolute;color:var(--text-primary)}
.lb .close{top:calc(14px + env(safe-area-inset-top));right:14px}
.lb .copy{top:calc(14px + env(safe-area-inset-top));left:14px;padding:0 16px}
.lb .copy.done{color:var(--status-success)}
.lb .prev{left:12px;top:50%;margin-top:-22px}
.lb .next{right:12px;top:50%;margin-top:-22px}
.lb .count{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:16px;font-size:14px;color:var(--text-primary)}

/* ===== Wide: iPad / desktop ===== */
@media (min-width:900px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .side{display:flex}
  .tabbar,.ph-only{display:none!important}
  .scroll{padding:0 36px}
  .content{max-width:980px;margin:0 auto}
  .bottom{padding:12px 36px 16px}
  .composer{max-width:980px;margin:0 auto}
  .kbhint{display:flex}
  body.typing .kbhint{visibility:visible}
  .grid{grid-template-columns:repeat(6,1fr)}
  .grid.all{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .just{grid-auto-columns:minmax(280px,1fr);margin:0;padding:0 0 4px}
  .sheet{left:50%;bottom:auto;top:50%;width:460px;transform:translate(-50%,-50%);border-radius:30px;animation:pop .26s cubic-bezier(.2,.9,.3,1.1);padding-bottom:24px}
  .grab{display:none}
  .li.msg .li-in{padding-right:96px}
}
@media (max-width:899px){
  .ggroup button{width:40px}
  .mini{font-size:16px}
  body.typing .tabbar{display:none}
  body.typing .bottom{padding-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
const API = '/api/messages';
const POLL_INTERVAL = 3000;
const RECONCILE_EVERY = 10;
// Mirrors the server limits, for rejecting before the bytes leave the device.
const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
const MAX_FILE_BYTES = 50 * 1024 * 1024;
const DEVICE_KEY = 'device_name';
const PREVIEW_LENGTH = 280;
const PREVIEW_LENGTH_IMAGES = 80;
// Just In cards are a glance, not a reader: shorter cut, and big type only for snippets.
const CARD_PREVIEW_LENGTH = 140;
const CARD_BIG_TEXT = 60;
const TABS = [['everything', 'Everything', 'tray'], ['text', 'Text', 'text'], ['photos', 'Photos', 'photo'], ['files', 'Files', 'doc']];

const $ = s => document.querySelector(s);
const ic = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h); return Math.abs(h); }
const tone = s => `var(--device-${hash(String(s || '?')) % 5 + 1})`;
function devIcon(name) {
  const n = (name || '').toLowerCase();
  if (/ipad|tablet/.test(n)) return 'ipad';
  if (/iphone|phone|android/.test(n)) return 'iphone';
  if (/mac|book|laptop/.test(n)) return 'laptop';
  return 'desktop';
}
const dvHTML = name => `<span class="dv" style="--dc:${tone(name)}">${ic(devIcon(name))}</span>`;
function rel(iso) {
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return Math.floor(d / 86400) + 'd ago';
}
function humanSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
const extOf = name => ((name || '').split('.').length > 1 ? name.split('.').pop() : 'file').slice(0, 4).toUpperCase();
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// ---------- identity ----------
let deviceName = localStorage.getItem(DEVICE_KEY) || '';
function getDeviceName() {
  if (deviceName) return deviceName;
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) return 'iPhone';
  if (/Android/.test(ua)) return /Tablet|Tab/.test(ua) ? 'Android Tablet' : 'Android Phone';
  if (/Mac/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows PC';
  return 'Unknown Device';
}

// ---------- state ----------
// all: the global window (newest 200 + anything polled since). dev: per-device windows
// fetched with ?device=, which can reach further back than the global 200.
const S = {
  all: new Map(), lastId: 0, dev: {},
  tab: 'everything', device: null, query: '',
  ui: new Map(), editing: null, online: true, loaded: false,
  gridImgs: [], suppressClickUntil: 0,
};
const uiOf = id => { let u = S.ui.get(id); if (!u) { u = { imgs: false, more: false }; S.ui.set(id, u); } return u; };
const scopeMap = () => S.device ? (S.dev[S.device]?.map || new Map()) : S.all;
const scopeList = () => [...scopeMap().values()].sort((a, b) => b.id - a.id);
const findMsg = id => scopeMap().get(id) || S.all.get(id);
// Document names are searchable too: "报告" should find the message carrying 报告.pdf.
function matches(m, q) {
  return (m.text || '').toLowerCase().includes(q) || (m.files || []).some(f => (f.original_name || '').toLowerCase().includes(q));
}
const flatImages = list => list.flatMap(m => (m.images || []).map((im, i) => ({ ...im, m, i })));
const flatFiles = list => list.flatMap(m => (m.files || []).map(f => ({ ...f, m })));
function deviceStats() {
  const d = new Map();
  for (const m of S.all.values()) {
    const s = d.get(m.device_name) || { name: m.device_name, count: 0, last: null };
    s.count++; if (!s.last || m.id > s.last.id) s.last = m;
    d.set(m.device_name, s);
  }
  return [...d.values()].sort((a, b) => b.last.id - a.last.id);
}

// ---------- rendering ----------
const view = $('#view'), scroller = $('#scroll'), mainEl = $('#main');
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function render() { renderChrome(); renderView(); }

function renderChrome() {
  const tabLabel = TABS.find(t => t[0] === S.tab)[1];
  const list = scopeList();
  const title = S.device || tabLabel;
  $('#title').textContent = title;
  $('#mini').textContent = title;
  document.title = S.device ? S.device + ' · MessageAnywhere' : 'MessageAnywhere';
  const stats = deviceStats();
  let sub;
  if (S.device) {
    const last = list[0];
    sub = [tabLabel, plural(list.length, 'message'), last ? 'active ' + rel(last.created_at) : ''].filter(Boolean).join(' · ');
  } else sub = plural(stats.length, 'device') + ' · ' + plural(S.all.size, 'message');
  $('#subtitle').textContent = ' · ' + sub;
  $('#backBtn').hidden = !S.device;
  $('#meBtn').hidden = !!S.device;
  $('#meBtn').innerHTML = ic(devIcon(getDeviceName()));
  $('#input').placeholder = S.device ? 'Send as ' + getDeviceName() : 'Send to all devices';

  const counts = { everything: list.length, text: list.length, photos: flatImages(list).length, files: flatFiles(list).length };
  $('#sideTabs').innerHTML = TABS.map(([k, label, icon]) =>
    `<button class="si" type="button" data-tab="${k}" aria-current="${S.tab === k}">${ic(icon)}<span class="lbl">${label}</span><span class="cnt num">${counts[k]}</span></button>`).join('');
  $('#tabs').innerHTML = TABS.map(([k, label, icon]) =>
    `<button class="tab" type="button" data-tab="${k}" aria-current="${S.tab === k}">${ic(icon)}${label}</button>`).join('');
  $('#sideDevCount').textContent = stats.length;
  $('#sideDevices').innerHTML =
    `<button class="si" type="button" data-device="" aria-current="${!S.device}">${ic('devices')}<span class="lbl">All Devices</span><span class="cnt num">${S.all.size}</span></button>` +
    stats.map(s => `<button class="si" type="button" data-device="${esc(s.name)}" aria-current="${S.device === s.name}">${dvHTML(s.name)}<span class="lbl">${esc(s.name)}</span><span class="cnt num">${s.count}</span></button>`).join('');
  $('#meCard').innerHTML = `${dvHTML(getDeviceName())}<span><b>${esc(getDeviceName())}</b><small>This device · tap to rename</small></span>${ic('pencil', 'ed')}`;
}

function empty(title, sub, err) { return `<div class="empty${err ? ' err' : ''}"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>`; }
function section(title, count, seeTab, body) {
  return `<section class="sec"><div class="sh"><h2>${title}${count != null ? ` <span class="num">${count}</span>` : ''}</h2>` +
    (seeTab ? `<button type="button" data-see="${seeTab}">See All${ic('chev')}</button>` : '') + `</div>${body}</section>`;
}

function viewHTML() {
  if (!S.loaded) return empty('Loading…');
  if (S.device) {
    const d = S.dev[S.device];
    if (!d || d.status === 'loading') return empty('Loading…');
    if (d.status === 'error') return empty('Failed to load', 'Check the connection and try Refresh.', true);
  }
  const list = scopeList();
  const q = S.query.trim().toLowerCase();
  if (!list.length) return S.device ? empty('No messages from this device') : empty('No messages yet', 'Type something below to get started');
  const hits = q ? list.filter(m => matches(m, q)) : list;
  const noMatch = () => empty(`No messages match “${S.query.trim()}”`);

  if (S.tab === 'photos') {
    const imgs = flatImages(hits);
    return imgs.length ? gridHTML(imgs, true) : (q ? noMatch() : empty('No photos yet', 'Photos you send show up here.'));
  }
  if (S.tab === 'files') {
    const files = q ? flatFiles(list).filter(f => (f.original_name || '').toLowerCase().includes(q) || (f.m.text || '').toLowerCase().includes(q)) : flatFiles(list);
    return files.length ? `<div class="list">${files.map(fileRowHTML).join('')}</div>` : (q ? noMatch() : empty('No files yet', 'Documents you send show up here.'));
  }
  if (S.tab === 'text' || q) {
    return hits.length ? `<div class="list">${hits.map(m => msgHTML(m, 'row')).join('')}</div>` : noMatch();
  }
  const just = list.slice(0, 5), rest = list.slice(5, 15);
  const imgs = flatImages(list), files = flatFiles(list);
  let h = section('Just In', null, null, `<div class="just">${just.map(m => msgHTML(m, 'card')).join('')}</div>`);
  if (imgs.length) h += section('Photos', imgs.length, imgs.length > 6 ? 'photos' : null, gridHTML(imgs.slice(0, 6), false, imgs));
  if (files.length) h += section('Files', files.length, files.length > 3 ? 'files' : null, `<div class="list">${files.slice(0, 3).map(fileRowHTML).join('')}</div>`);
  if (rest.length) h += section('Text', list.length, 'text', `<div class="list">${rest.map(m => msgHTML(m, 'row')).join('')}</div>`);
  return h;
}

function gridHTML(shown, all, lightboxList) {
  S.gridImgs = lightboxList || shown;
  return `<div class="grid${all ? ' all' : ''}">` + shown.map((im, i) =>
    `<button class="ph" type="button" data-ph="${i}" aria-label="Open photo from ${esc(im.m.device_name)}"><img src="${esc(im.url)}" alt="${esc(im.original_name)}" loading="lazy" decoding="async"><span>${esc(rel(im.m.created_at).replace(' ago', ''))}</span></button>`).join('') + '</div>';
}

function fileRowHTML(f) {
  const ext = extOf(f.original_name);
  return `<a class="frow" href="${esc(f.url)}" download="${esc(f.original_name)}" title="${esc(f.original_name)}"><span class="doc" style="--fc:${tone(ext)}">${esc(ext)}</span>` +
    `<span class="fm"><b>${esc(f.original_name)}</b><small>${esc(humanSize(f.size))} · ${esc(f.m.device_name)} · <time data-t="${esc(f.m.created_at)}">${rel(f.m.created_at)}</time></small></span>${ic('dl')}</a>`;
}

function filesHTML(files) {
  return (files || []).map(f => {
    const ext = extOf(f.original_name);
    return `<a class="file" href="${esc(f.url)}" download="${esc(f.original_name)}" title="${esc(f.original_name)}"><span class="doc" style="--fc:${tone(ext)}">${esc(ext)}</span><span class="fm"><b>${esc(f.original_name)}</b><small>${esc(humanSize(f.size))}</small></span>${ic('dl')}</a>`;
  }).join('');
}

function thumbsHTML(images) {
  return `<div class="thumbs${images.length === 1 ? ' one' : ''}">` + images.map((im, i) =>
    `<img class="thumb" src="${esc(im.url)}" alt="${esc(im.original_name)}" loading="lazy" decoding="async" data-idx="${i}">`).join('') + '</div>';
}

function msgHTML(m, kind) {
  const u = uiOf(m.id);
  const hasImg = (m.images || []).length > 0, hasFile = (m.files || []).length > 0;
  const editing = S.editing === m.id;
  const text = m.text || '';
  const limit = hasImg ? PREVIEW_LENGTH_IMAGES : kind === 'card' ? CARD_PREVIEW_LENGTH : PREVIEW_LENGTH;
  const long = text.length > limit;
  let body = '';
  if (editing) {
    body += `<div class="edit"><textarea class="edit-ta" rows="3" maxlength="10000" aria-label="Edit message">${esc(text)}</textarea>` +
      `<div class="acts"><small>Enter to save · Shift+Enter new line · Esc to cancel</small><button class="pill" type="button" data-act="cancel-edit">Cancel</button><button class="pill fill" type="button" data-act="save-edit">Save</button></div></div>`;
  } else if (text) {
    body += `<div class="tx${long && !u.more ? ' clamp' : ''}${kind === 'card' && text.length > CARD_BIG_TEXT ? ' body' : ''}">${esc(long && !u.more ? text.slice(0, limit) + '…' : text)}</div>` +
      (long ? `<button class="more" type="button" data-act="more">${u.more ? 'Show Less' : 'Show More'}</button>` : '');
  } else {
    body += `<div class="tx muted">${hasImg ? 'Photo' : 'File'}</div>`;
  }
  if (hasImg) body += (u.imgs || editing) ? thumbsHTML(m.images)
    : `<div class="reveal">${ic('eye')}${plural(m.images.length, 'Photo')} · Tap to Show</div>`;
  if (hasFile) body += filesHTML(m.files);
  const meta = `<div class="meta">${S.device ? `<span class="who">${esc(m.device_name)}</span>` : `<button class="who" type="button" data-act="device">${esc(m.device_name)}</button>`}<time data-t="${esc(m.created_at)}">${rel(m.created_at)}</time></div>`;
  const flash = `<span class="flash">${ic('check')}Copied</span>`;
  const cls = `msg${editing ? ' editing' : ''}`;
  if (kind === 'card') {
    return `<article class="card ${cls}" data-id="${m.id}" data-kind="card" tabindex="0" style="--dc:${tone(m.device_name)}"><div class="top">${dvHTML(m.device_name)}${meta}</div>${body}${flash}</article>`;
  }
  return `<div class="li ${cls}" data-id="${m.id}" data-kind="row" tabindex="0"><div class="li-in">${dvHTML(m.device_name)}<div class="m">${meta}${body}</div></div>${flash}</div>`;
}

// Keeps the message under the user's eye in place when newer items land above it.
function renderView() {
  let anchor = null;
  if (scroller.scrollTop > 0) {
    const top = scroller.getBoundingClientRect().top;
    for (const el of view.querySelectorAll('.li.msg,.frow,.card')) {
      const r = el.getBoundingClientRect();
      if (r.bottom > top + 60) { anchor = { key: el.dataset.id || el.getAttribute('href'), off: r.top }; break; }
    }
  }
  view.innerHTML = viewHTML();
  if (anchor) {
    const el = [...view.querySelectorAll('.li.msg,.frow,.card')].find(e => (e.dataset.id || e.getAttribute('href')) === anchor.key);
    if (el) scroller.scrollTop += el.getBoundingClientRect().top - anchor.off;
  }
}

function updateMsg(id) {
  const m = findMsg(id);
  view.querySelectorAll(`.msg[data-id="${id}"]`).forEach(el => {
    if (!m) { el.remove(); return; }
    const t = document.createElement('template');
    t.innerHTML = msgHTML(m, el.dataset.kind);
    el.replaceWith(t.content.firstElementChild);
  });
}

// ---------- data ----------
const sig = m => m.text + '|' + m.created_at + '|' + JSON.stringify(m.images || []) + JSON.stringify(m.files || []);
function store(map, m) {
  const old = map.get(m.id);
  if (old && sig(old) === sig(m)) return false;
  map.set(m.id, m); return true;
}
function trackLast(m) { if (m.id > S.lastId) S.lastId = m.id; }
// A full response is capped at 200, so "absent from the response" only means deleted
// inside the returned window; older ids are simply out of view.
function reconcileInto(map, list) {
  let changed = false;
  const byId = new Map(list.map(m => [m.id, m]));
  const lo = list.length ? Math.min(...list.map(m => m.id)) : 0;
  const full = list.length < 200;
  for (const id of [...map.keys()]) {
    if (!full && id < lo) continue;
    const m = byId.get(id);
    if (!m) { map.delete(id); changed = true; if (S.editing === id) S.editing = null; continue; }
    if (S.editing === id) continue;
    if (store(map, m)) changed = true;
  }
  for (const m of list) if (!map.has(m.id)) { map.set(m.id, m); changed = true; }
  return changed;
}

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

function setOnline(on) {
  if (S.online === on) return;
  S.online = on;
  $('#status').textContent = on ? 'Local network' : 'Offline';
  $('#statusDot').classList.toggle('off', !on);
  $('#sideDot').classList.toggle('off', !on);
}

let polling = false, pollFailures = 0, pollCount = 0;
async function poll() {
  if (polling) return; polling = true;
  try {
    const data = await getJSON(API + (S.lastId > 0 ? '?since=' + S.lastId : ''));
    pollFailures = 0; setOnline(true);
    let changed = !S.loaded; S.loaded = true;
    for (const m of data.messages) { if (store(S.all, m)) changed = true; trackLast(m); }
    const dev = S.device, d = dev && S.dev[dev];
    if (d && d.status === 'ok') {
      const dd = await getJSON(API + '?device=' + encodeURIComponent(dev) + '&since=' + d.last);
      if (S.dev[dev] === d) for (const m of dd.messages) { if (store(d.map, m)) changed = true; d.last = Math.max(d.last, m.id); }
    }
    if (++pollCount % RECONCILE_EVERY === 0) { if (await reconcileAll(true)) changed = true; }
    if (changed) scheduleRender();
  } catch (e) {
    if (++pollFailures >= 2) setOnline(false);
  } finally { polling = false; }
}

// ?since= only ever returns new ids, so edits, deletes and expiries are invisible to
// every other open client. Re-align against a full fetch.
async function reconcileAll(quiet) {
  try {
    const data = await getJSON(API);
    let changed = reconcileInto(S.all, data.messages);
    data.messages.forEach(trackLast);
    const dev = S.device, d = dev && S.dev[dev];
    if (d && d.status === 'ok') {
      const dd = await getJSON(API + '?device=' + encodeURIComponent(dev));
      if (S.dev[dev] === d && reconcileInto(d.map, dd.messages)) changed = true;
    }
    if (changed && !quiet) scheduleRender();
    return changed;
  } catch { return false; }
}

// Opening device A then quickly B must not let A's response land in B's view.
function loadDevice(name) {
  const d = { map: new Map(), last: 0, status: 'loading' };
  S.dev[name] = d;
  getJSON(API + '?device=' + encodeURIComponent(name)).then(data => {
    if (S.dev[name] !== d) return;
    for (const m of data.messages) { d.map.set(m.id, m); d.last = Math.max(d.last, m.id); }
    d.status = 'ok';
  }).catch(() => { if (S.dev[name] === d) d.status = 'error'; }).finally(() => { if (S.device === name) scheduleRender(); });
}

// ---------- navigation ----------
function setTab(tab) {
  if (S.tab === tab) { scroller.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  S.tab = tab; scroller.scrollTop = 0; render();
}
function setDevice(name) {
  name = name || null;
  if (S.device === name) return;
  saveDraftText();
  S.device = name; S.editing = null;
  if (name) loadDevice(name);
  loadDraft();
  scroller.scrollTop = 0; render();
}
$('#backBtn').addEventListener('click', () => setDevice(null));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { setTab(t.dataset.tab); return; }
  const d = e.target.closest('[data-device]'); if (d) { setDevice(d.dataset.device); }
});
$('#searchTab').addEventListener('click', () => { scroller.scrollTo({ top: 0 }); search.focus(); });

// ---------- search ----------
const search = $('#search');
search.addEventListener('input', () => { S.query = search.value; $('#searchClear').hidden = !search.value; scheduleRender(); });
$('#searchClear').addEventListener('click', () => { search.value = ''; S.query = ''; $('#searchClear').hidden = true; render(); search.focus(); });

// ---------- message interactions ----------
const isAttachment = t => !!t.closest('img.thumb, a.file, .ph');

function copyText(text, el) {
  const done = () => { el.classList.add('copied'); clearTimeout(el._flash); el._flash = setTimeout(() => el.classList.remove('copied'), 1200); };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) done();
    } catch {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

view.addEventListener('click', e => {
  if (Date.now() < S.suppressClickUntil) { e.preventDefault(); return; }
  const see = e.target.closest('[data-see]'); if (see) { setTab(see.dataset.see); return; }
  const ph = e.target.closest('.ph'); if (ph) { openLightbox(S.gridImgs.map(x => x), +ph.dataset.ph); return; }
  const el = e.target.closest('.msg'); if (!el) return;
  const id = +el.dataset.id, m = findMsg(id); if (!m) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  // A click inside the edit UI must not dismiss it; anywhere else on the message cancels.
  if (S.editing === id) {
    if (act === 'save-edit') saveEdit(id);
    else if (act === 'cancel-edit' || !e.target.closest('.edit')) cancelEdit();
    return;
  }
  if (act === 'device') { setDevice(m.device_name); return; }
  if (act === 'more') { const u = uiOf(id); u.more = !u.more; updateMsg(id); return; }
  if (e.target.closest('a.file')) return;
  const thumb = e.target.closest('img.thumb');
  if (thumb) { openLightbox(m.images, +thumb.dataset.idx); return; }
  if ((m.images || []).length) {
    const u = uiOf(id);
    u.imgs = !u.imgs;
    // Expanding shows the whole message; collapsing returns to the short preview.
    u.more = u.imgs;
    updateMsg(id); return;
  }
  copyText(m.text || '', el);
});

view.addEventListener('keydown', e => {
  const el = e.target.classList?.contains('msg') ? e.target : null;
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
  if (el && (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) { e.preventDefault(); openCtx(el); }
  if (e.target.classList?.contains('edit-ta')) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); saveEdit(S.editing); }
    if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  }
});

view.addEventListener('dblclick', e => {
  const thumb = e.target.closest('img.thumb');
  const el = e.target.closest('.msg'); if (!el) return;
  const id = +el.dataset.id, m = findMsg(id); if (!m || S.editing === id) return;
  if (thumb) { e.stopPropagation(); openLightbox(m.images, +thumb.dataset.idx); return; }
  // Collapsed photos: both clicks landed on the body meaning "show me", not "delete".
  if ((m.images || []).length && !uiOf(id).imgs) return;
  if (isAttachment(e.target) || e.target.closest('[data-act]')) return;
  deleteMessage(id, el);
});

view.addEventListener('contextmenu', e => {
  const el = e.target.closest('.msg'); if (!el || S.editing === +el.dataset.id) return;
  // Right-clicking an attachment belongs to the browser's own save/copy menu.
  if (isAttachment(e.target)) return;
  e.preventDefault();
  openCtx(el, e.pointerType === 'touch' ? null : e.clientX, e.pointerType === 'touch' ? null : e.clientY);
});

// Swipe-left to delete (list rows) and long-press for the menu (rows and cards).
let T = null;
const cancelLongPress = () => { if (T && T.timer) { clearTimeout(T.timer); T.timer = null; } };
view.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { T = null; return; }
  const el = e.target.closest('.msg');
  if (!el || S.editing === +el.dataset.id || isAttachment(e.target) || e.target.closest('[data-act]')) { T = null; return; }
  const t = e.touches[0];
  T = { el, x: t.clientX, y: t.clientY, dx: 0, swiping: false, canSwipe: el.dataset.kind === 'row' };
  T.timer = setTimeout(() => { if (T && !T.swiping) { T.timer = null; S.suppressClickUntil = Date.now() + 700; openCtx(T.el); } }, 500);
}, { passive: true });
view.addEventListener('touchmove', e => {
  if (!T) return;
  const dx = e.touches[0].clientX - T.x, dy = e.touches[0].clientY - T.y;
  // A mostly-vertical drag is a scroll: neither a swipe nor a long press.
  if (!T.swiping && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { cancelLongPress(); T = null; return; }
  if (Math.abs(dx) > 10) cancelLongPress();
  if (T.canSwipe && !T.swiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) { T.swiping = true; T.el.classList.add('swiped'); }
  if (!T.swiping) return;
  e.preventDefault();
  T.dx = Math.max(-120, Math.min(0, dx));
  const inner = T.el.querySelector('.li-in'); inner.style.transition = 'none'; inner.style.transform = `translateX(${T.dx}px)`;
}, { passive: false });
function restoreSwipe(el) {
  const inner = el.querySelector('.li-in'); if (!inner) return;
  inner.style.transition = ''; inner.style.transform = '';
  setTimeout(() => el.classList.remove('swiped'), 250);
}
view.addEventListener('touchend', () => {
  cancelLongPress(); if (!T) return;
  if (T.swiping) {
    const inner = T.el.querySelector('.li-in'); inner.style.transition = '';
    S.suppressClickUntil = Date.now() + 400;
    if (T.dx < -80) { inner.style.transform = 'translateX(-120%)'; deleteMessage(+T.el.dataset.id, T.el); }
    else restoreSwipe(T.el);
  }
  T = null;
});
// iOS takes over the gesture mid-scroll and never fires touchend.
view.addEventListener('touchcancel', () => { cancelLongPress(); if (T && T.swiping) restoreSwipe(T.el); T = null; });

async function deleteMessage(id, el) {
  try {
    const r = await fetch(API + '/' + id, { method: 'DELETE' });
    if (r.ok || r.status === 404) {
      S.all.delete(id); for (const d of Object.values(S.dev)) d.map.delete(id);
      S.ui.delete(id); if (S.editing === id) S.editing = null;
      render();
    } else { if (el) restoreSwipe(el); showError('Failed to delete'); }
  } catch { if (el) restoreSwipe(el); showError('Failed to delete. Server may be offline.'); }
}

function enterEdit(id) {
  if (S.editing && S.editing !== id) { const prev = S.editing; S.editing = null; updateMsg(prev); }
  S.editing = id; updateMsg(id);
  const ta = view.querySelector(`.msg[data-id="${id}"] .edit-ta`);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function cancelEdit() { const id = S.editing; S.editing = null; if (id) updateMsg(id); }
async function saveEdit(id) {
  const ta = view.querySelector(`.msg[data-id="${id}"] .edit-ta`); if (!ta) return;
  const text = ta.value.trim(); const m = findMsg(id);
  if (!text && !(m.images || []).length && !(m.files || []).length) { showError('Message cannot be empty'); return; }
  try {
    const r = await fetch(API + '/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (r.ok) {
      // The server returns the full message, attachments included.
      const updated = await r.json().catch(() => null) || { ...m, text };
      S.editing = null;
      store(S.all, updated); for (const d of Object.values(S.dev)) if (d.map.has(id)) store(d.map, updated);
      updateMsg(id);
    } else { const err = await r.json().catch(() => ({})); showError(err.error || 'Failed to save'); }
  } catch { showError('Failed to save. Server may be offline.'); }
}

// ---------- context menu ----------
const ctxLayer = $('#ctxLayer'), ctx = $('#ctx');
let ctxId = null;
function openCtx(el, x, y) {
  if (!ctxLayer.hidden) return;
  const id = +el.dataset.id, m = findMsg(id); if (!m) return;
  ctxId = id;
  const atPointer = x != null && matchMedia('(pointer:fine)').matches;
  ctx.classList.toggle('at', atPointer);
  $('#ctxScrim').className = 'scrim' + (atPointer ? ' clear' : ' blur');
  const preview = $('#ctxPreview');
  preview.hidden = atPointer;
  if (!atPointer) preview.innerHTML = `<div class="meta">${dvHTML(m.device_name)}<span class="who">${esc(m.device_name)}</span><time>${rel(m.created_at)}</time></div><div class="tx">${esc(m.text || ((m.images || []).length ? plural(m.images.length, 'Photo') : 'File'))}</div>`;
  if (atPointer) {
    ctx.style.left = Math.min(x, innerWidth - 262) + 'px'; ctx.style.top = Math.min(y, innerHeight - 170) + 'px'; ctx.style.transform = 'none'; ctx.style.width = 'auto';
  } else { ctx.style.left = ''; ctx.style.top = ''; ctx.style.transform = ''; ctx.style.width = ''; }
  ctxLayer.hidden = false;
  ctx.querySelector('.mi').focus({ preventScroll: true });
}
function closeCtx() { ctxLayer.hidden = true; ctxId = null; }
$('#ctxScrim').addEventListener('click', closeCtx);
$('#ctxScrim').addEventListener('contextmenu', e => { e.preventDefault(); closeCtx(); });
ctx.addEventListener('click', e => {
  const b = e.target.closest('[data-ctx]'); if (!b) return;
  const id = ctxId; closeCtx();
  const m = findMsg(id); if (!m) return;
  const el = view.querySelector(`.msg[data-id="${id}"]`);
  if (b.dataset.ctx === 'copy' && el) copyText(m.text || '', el);
  if (b.dataset.ctx === 'edit') enterEdit(id);
  if (b.dataset.ctx === 'delete') deleteMessage(id, el);
});

// ---------- pull-down menus ----------
const menuLayer = $('#menuLayer'), menu = $('#menu');
let menuBtn = null;
function openMenu(btn, html) {
  if (menuBtn === btn) { closeMenu(); return; }
  closeMenu();
  menu.innerHTML = html;
  const r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 8) + 'px';
  menu.style.right = Math.max(12, innerWidth - r.right) + 'px';
  menuLayer.hidden = false; menuBtn = btn; btn.setAttribute('aria-expanded', 'true');
  menu.querySelector('.mi')?.focus({ preventScroll: true });
}
function closeMenu() { if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false'); menuBtn = null; menuLayer.hidden = true; }
menuLayer.querySelector('.scrim').addEventListener('click', closeMenu);
$('#filterBtn').addEventListener('click', e => {
  const stats = deviceStats();
  openMenu(e.currentTarget,
    `<button class="mi" data-device="" role="menuitem"><span class="lab"><span>All Devices</span><small>${plural(S.all.size, 'message')}</small></span>${!S.device ? ic('check') : ''}</button><div class="mgap"></div>` +
    stats.map(s => `<button class="mi" data-device="${esc(s.name)}" role="menuitem"><span class="lab"><span>${esc(s.name)}${s.name === getDeviceName() ? ' · This Device' : ''}</span><small>${s.count} · ${rel(s.last.created_at)}</small></span>${S.device === s.name ? ic('check') : dvHTML(s.name)}</button>`).join('') +
    `<div class="mgap"></div><button class="mi" data-menu="rename" role="menuitem">Rename This Device…${ic('pencil')}</button>`);
});
$('#moreBtn').addEventListener('click', e => openMenu(e.currentTarget,
  `<button class="mi" data-menu="new" role="menuitem">New Message${ic('plus')}</button>` +
  `<button class="mi" data-menu="refresh" role="menuitem">Refresh${ic('refresh')}</button>` +
  `<button class="mi" data-menu="rename" role="menuitem">Rename This Device…${ic('pencil')}</button>`));
menu.addEventListener('click', e => {
  const b = e.target.closest('.mi'); if (!b) return;
  closeMenu();
  if (b.dataset.menu === 'new') { input.focus(); }
  if (b.dataset.menu === 'refresh') refresh();
  if (b.dataset.menu === 'rename') openSheet();
});
function refresh() { poll(); reconcileAll(); }
$('#refreshBtn').addEventListener('click', refresh);

// ---------- rename sheet ----------
const sheetLayer = $('#sheetLayer'), nameInput = $('#nameInput');
let sheetReturn = null;
function openSheet() {
  sheetReturn = document.activeElement;
  nameInput.value = getDeviceName(); sheetLayer.hidden = false;
  nameInput.focus(); nameInput.select();
}
function closeSheet() { sheetLayer.hidden = true; sheetReturn?.focus?.({ preventScroll: true }); }
function saveName() {
  const n = nameInput.value.trim();
  if (n) { deviceName = n; localStorage.setItem(DEVICE_KEY, n); render(); }
  closeSheet();
}
$('#meBtn').addEventListener('click', openSheet);
$('#meCard').addEventListener('click', openSheet);
$('#sheetCancel').addEventListener('click', closeSheet);
$('#sheetScrim').addEventListener('click', closeSheet);
$('#sheetDone').addEventListener('click', saveName);
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveName(); }
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
});
$('#sheet').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...$('#sheet').querySelectorAll('button,input')];
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
});

// ---------- lightbox ----------
const lb = $('#lb'), lbImg = $('#lbImg'), lbCopy = $('#lbCopy');
let lbList = [], lbIdx = 0, lbBlobs = [];
function openLightbox(list, idx) {
  lbList = list; lbIdx = idx; lbBlobs = [];
  showLb(); lb.hidden = false;
  $('#lbClose').focus({ preventScroll: true });
}
function showLb() {
  const im = lbList[lbIdx];
  lbImg.src = im.url; lbImg.alt = im.original_name || '';
  const many = lbList.length > 1;
  $('#lbPrev').hidden = !many; $('#lbNext').hidden = !many;
  $('#lbCount').hidden = !many; $('#lbCount').textContent = `${lbIdx + 1} / ${lbList.length}`;
  ensureBlob(lbIdx);
}
function closeLightbox() { lb.hidden = true; lbImg.removeAttribute('src'); }
const lbNav = d => { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); };
$('#lbClose').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', () => lbNav(-1));
$('#lbNext').addEventListener('click', () => lbNav(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
// Fetch starts from the gesture that opened the lightbox, so by the time Copy is
// pressed the blob is warm and clipboard.write() keeps its user activation.
function ensureBlob(i) { if (!lbBlobs[i]) lbBlobs[i] = fetch(lbList[i].url).then(r => r.blob()); return lbBlobs[i]; }
// ClipboardItem accepts image/png far more widely than jpeg/webp.
function toPng(blob) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? ok(b) : no(new Error('toBlob failed')); }, 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('decode failed')); };
    img.src = url;
  });
}
lbCopy.addEventListener('click', async () => {
  // navigator.clipboard only exists in a secure context, and http://<lan-ip> is not one.
  // Check synchronously so the fallback opens without being treated as a popup.
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) {
    const url = lbList[lbIdx].url;
    const w = window.open(url, '_blank'); if (!w) location.href = url;
    showError('Clipboard needs HTTPS — opened the image instead. Long-press it to save or copy.');
    return;
  }
  lbCopy.disabled = true;
  try {
    const png = await toPng(await ensureBlob(lbIdx));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    lbCopy.classList.add('done'); lbCopy.lastChild.textContent = 'Copied';
    setTimeout(() => { lbCopy.classList.remove('done'); lbCopy.lastChild.textContent = 'Copy'; }, 1200);
  } catch { showError('Copy failed — long-press the image to save it instead.'); }
  finally { lbCopy.disabled = false; }
});

// ---------- composer ----------
const input = $('#input'), sendBtn = $('#sendBtn'), att = $('#att');
// One draft per scope (all devices, or a single device) — switching views keeps each one.
const drafts = new Map();
const draftKey = () => S.device || '';
function draft() { let d = drafts.get(draftKey()); if (!d) { d = { text: '', images: [], files: [] }; drafts.set(draftKey(), d); } return d; }
function saveDraftText() { draft().text = input.value; }
function loadDraft() { input.value = draft().text; autosize(); renderAtt(); }
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autosize);

function renderAtt() {
  const d = draft();
  const all = [...d.images.map(f => ['img', f]), ...d.files.map(f => ['file', f])];
  att.hidden = !all.length;
  if (!all.length) { att.innerHTML = ''; return; }
  const bytes = all.reduce((s, [, f]) => s + f.size, 0);
  att.innerHTML = all.map(([k, f], i) => {
    if (k === 'img') { f._url = f._url || URL.createObjectURL(f); }
    return `<span class="item" title="${esc(f.name || 'Pasted image')}">${k === 'img' ? `<img src="${f._url}" alt="">` : esc(extOf(f.name))}<button class="x" type="button" data-rm="${k}:${k === 'img' ? i : i - d.images.length}" aria-label="Remove attachment">${ic('x')}</button></span>`;
  }).join('') + `<small>${plural(all.length, 'attachment')} · ${humanSize(bytes)}</small>`;
}
att.addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  const [k, i] = b.dataset.rm.split(':'); const d = draft();
  const arr = k === 'img' ? d.images : d.files;
  const [f] = arr.splice(+i, 1); if (f && f._url) URL.revokeObjectURL(f._url);
  renderAtt();
});
$('#attachImg').addEventListener('click', () => $('#imgInput').click());
$('#attachFile').addEventListener('click', () => $('#fileInput').click());
$('#imgInput').addEventListener('change', e => { draft().images.push(...e.target.files); e.target.value = ''; renderAtt(); });
$('#fileInput').addEventListener('change', e => { draft().files.push(...e.target.files); e.target.value = ''; renderAtt(); });
document.addEventListener('paste', e => {
  const a = document.activeElement;
  if (a && (a === search || a === nameInput || a.classList.contains('edit-ta'))) return;
  const items = e.clipboardData?.items; if (!items) return;
  let added = false;
  for (const item of items) if (item.type.startsWith('image/')) { const f = item.getAsFile(); if (f) { draft().images.push(f); added = true; } }
  if (added) { e.preventDefault(); renderAtt(); }
});

// Reject before pushing bytes over the network; the server would only refuse them after the upload.
function checkSize(d) {
  if (d.images.some(f => f.size > MAX_IMAGE_BYTES)) return 'Images are limited to 5 MB';
  if (d.files.some(f => f.size > MAX_FILE_BYTES)) return 'Files are limited to 50 MB';
  return null;
}
async function sendMessage() {
  const d = draft(), text = input.value.trim();
  const hasAtt = d.images.length > 0 || d.files.length > 0;
  if (!text && !hasAtt) return;
  const sizeErr = checkSize(d); if (sizeErr) { showError(sizeErr); return; }
  sendBtn.disabled = true;
  try {
    let r;
    if (hasAtt) {
      const fd = new FormData();
      fd.append('device_name', getDeviceName());
      if (text) fd.append('text', text);
      d.images.forEach(f => fd.append('images', f));
      d.files.forEach(f => fd.append('files', f));
      r = await fetch(API, { method: 'POST', body: fd });
    } else {
      r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, device_name: getDeviceName() }) });
    }
    if (r.ok) {
      input.value = ''; d.text = '';
      d.images.forEach(f => f._url && URL.revokeObjectURL(f._url));
      d.images = []; d.files = [];
      renderAtt(); autosize(); poll();
    } else { const err = await r.json().catch(() => ({})); showError(err.error || 'Failed to send'); }
  } catch { showError('Failed to send. Server may be offline.'); }
  finally { sendBtn.disabled = false; }
}
sendBtn.addEventListener('click', sendMessage);
// Keeps the keyboard up (and the layout still) while tapping Send, attach or remove,
// like Messages. Letting the field blur mid-tap moves the composer under the pointer.
$('.composer').addEventListener('pointerdown', e => { if (e.target.closest('button') && document.activeElement === input) e.preventDefault(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('focus', () => document.body.classList.add('typing'));
input.addEventListener('blur', () => document.body.classList.remove('typing'));

// ---------- toast ----------
const toast = $('#toast');
function showError(msg) {
  toast.innerHTML = ic('warn') + esc(msg); toast.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { toast.hidden = true; }, 4000);
}

// ---------- global keys ----------
document.addEventListener('keydown', e => {
  if (!lb.hidden) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
    return;
  }
  if (e.key === 'Escape') {
    if (!sheetLayer.hidden) { closeSheet(); return; }
    if (!ctxLayer.hidden) { closeCtx(); return; }
    if (!menuLayer.hidden) { closeMenu(); return; }
  }
  const typing = e.target.closest?.('input,textarea,[contenteditable]');
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); scroller.scrollTo({ top: 0 }); search.focus(); }
});

// ---------- scroll-edge + viewport ----------
let scrolled = false;
scroller.addEventListener('scroll', () => {
  const s = scroller.scrollTop > 44;
  if (s !== scrolled) { scrolled = s; mainEl.classList.toggle('scrolled', s); }
}, { passive: true });
// iOS Safari ignores interactive-widget, so track the visual viewport to keep the
// composer sitting on top of the keyboard.
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => { document.documentElement.style.setProperty('--vvh', vv.height + 'px'); if (vv.offsetTop) window.scrollTo(0, 0); };
  vv.addEventListener('resize', fit); fit();
}

// ---------- start ----------
render();
poll();
setInterval(poll, POLL_INTERVAL);
// Coming back to the tab is the cheapest moment to re-align.
document.addEventListener('visibilitychange', () => { if (!document.hidden) reconcileAll(); });
setInterval(() => document.querySelectorAll('time[data-t]').forEach(t => { t.textContent = rel(t.dataset.t); }), 30000);
</script>
</body>
</html>
